services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wifi_troubleshooter
      POSTGRES_USER: wifi_troubleshooter
      POSTGRES_PASSWORD: wifi_troubleshooter
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
